---
# ============================================================================
# PETASCALE CONFIGURE CLEANUP PLAYBOOK
# ============================================================================
#
# This playbook performs manual cleanup of SP Server configuration artifacts
# to allow clean retesting of the petascale configure flow.
#
# It is intended for:
#   - configure retry after failure
#   - test environment reset between configure runs
#
# It is NOT a replacement for petascale_uninstall.yml.
#
# ============================================================================
# FEATURES
# ============================================================================
#
# - Multi-stage process shutdown (graceful → retry → force kill)
# - Automatic escalation to SIGKILL for stubborn processes
# - Configurable retry attempts and wait periods
# - Enhanced logging with stage indicators
# - Force mode (default) or strict mode operation
#
# For detailed configuration options and troubleshooting, see:
#   playbooks/CLEANUP_CONFIGURATION_GUIDE.md
#
# ============================================================================
# USAGE EXAMPLES
# ============================================================================
#
# Cleanup configuration on all SP Server nodes (force mode - default):
#   ansible-playbook playbooks/petascale_configure_cleanup.yml \
#     -i playbooks/inventory/petascale.ini
#
# Cleanup configuration on specific hosts:
#   ansible-playbook playbooks/petascale_configure_cleanup.yml \
#     -i playbooks/inventory/petascale.ini \
#     --limit sp-server-03
#
# Strict mode (fail if processes won't stop):
#   ansible-playbook playbooks/petascale_configure_cleanup.yml \
#     -i playbooks/inventory/petascale.ini \
#     -e "cleanup_force_mode=false"
#
# Custom retry configuration:
#   ansible-playbook playbooks/petascale_configure_cleanup.yml \
#     -i playbooks/inventory/petascale.ini \
#     -e "cleanup_max_retries=5" \
#     -e "cleanup_wait_seconds=15"
#
# ============================================================================
# Display Cleanup Banner
# ============================================================================
- name: Display configure cleanup banner
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Display cleanup warning
      ansible.builtin.debug:
        msg: |
          ============================================================
          PETASCALE CONFIGURE CLEANUP PLAYBOOK
          ============================================================

          This playbook removes SP Server configuration artifacts to allow
          clean retesting of the configure flow.

          It will:
          - stop DB2 and dsmserv processes
          - drop DB2 instance
          - remove TSM user and group
          - remove instance directories and configuration files

          It will NOT run IMCL uninstall.

          ============================================================
      run_once: true

# ============================================================================
# Cleanup SP Server Configuration
# ============================================================================
- name: Cleanup SP Server configuration on sp_servers nodes
  hosts: sp_servers
  gather_facts: true
  become: true

  tasks:
    - name: Display cleanup start message
      ansible.builtin.debug:
        msg: |
          ============================================================
          Starting SP Server Configure Cleanup on {{ inventory_hostname }}
          ============================================================
          Host: {{ inventory_hostname }}
          IP: {{ ansible_host | default(inventory_hostname) }}
          OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
          ============================================================

    - name: Run SP Server cleanup tasks
      ansible.builtin.include_tasks: ../roles/sp_server_install/tasks/sp_server_clean_config_petascale.yml

    - name: Remove BA client configuration files created by petascale configure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/tivoli/tsm/client/ba/bin/dsm.sys
        - /opt/tivoli/tsm/client/ba/bin/dsm.opt
        - /var/log/tsm
      failed_when: false

    - name: Display cleanup completion
      ansible.builtin.debug:
        msg: |
          ============================================================
          SP SERVER CONFIGURE CLEANUP COMPLETE
          ============================================================
          Host: {{ inventory_hostname }}
          Cleanup completed for configure retesting.
          ============================================================

# ============================================================================
# Cleanup Summary
# ============================================================================
- name: SP Server Configure Cleanup Summary
  hosts: sp_servers
  gather_facts: false
  become: false

  tasks:
    - name: Generate cleanup summary report
      run_once: true
      ansible.builtin.debug:
        msg: |
          ============================================================
          SP SERVER CONFIGURE CLEANUP SUMMARY REPORT
          ============================================================
          Hosts processed:
          {% for host in groups['sp_servers'] %}
            - {{ host }}
          {% endfor %}
          ============================================================
...

