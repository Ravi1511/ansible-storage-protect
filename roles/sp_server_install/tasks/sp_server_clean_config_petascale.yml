# Check if TSM user exists before attempting cleanup
- name: Check if TSM user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ tsm_user }}"
  register: tsm_user_check
  failed_when: false

- name: Check if DB2 binary exists
  ansible.builtin.stat:
    path: "/opt/tivoli/tsm/db2/bin/db2fmcu"
  register: db2_binary_check

# ============================================================================
# DB2 Shutdown - Multi-Stage Robust Process
# ============================================================================

# Stage 1: Graceful Shutdown Attempts
- name: "[Stage 1] Stop DB2 process (db2fmcu -d)"
  ansible.builtin.shell: "/opt/tivoli/tsm/db2/bin/db2fmcu -d"
  become: true
  when: db2_binary_check.stat.exists
  register: db2_stop_result
  failed_when: false

- name: "[Stage 1] Display DB2 stop result"
  ansible.builtin.debug:
    msg: "DB2 process stop (db2fmcu): {{ 'SUCCESS' if db2_stop_result.rc == 0 else 'FAILED (rc=' + (db2_stop_result.rc | string) + ')' }}"
  when: db2_binary_check.stat.exists

- name: "[Stage 1] Force DB2 applications"
  ansible.builtin.shell: "sudo su - {{ tsm_user }} -c '. /home/{{ tsm_user }}/sqllib/db2profile && db2 force application all'"
  when: tsm_user_check.ansible_facts is defined
  register: db2_force_result
  failed_when: false

- name: "[Stage 1] Display DB2 force applications result"
  ansible.builtin.debug:
    msg: "DB2 force applications: {{ 'SUCCESS' if db2_force_result.rc == 0 else 'FAILED (rc=' + (db2_force_result.rc | string) + ')' }}"
  when: tsm_user_check.ansible_facts is defined

- name: "[Stage 1] Stop DB2 instance (db2stop force)"
  ansible.builtin.shell: "sudo su - {{ tsm_user }} -c '. /home/{{ tsm_user }}/sqllib/db2profile && db2stop force'"
  when: tsm_user_check.ansible_facts is defined
  register: db2_instance_stop_result
  failed_when: false

- name: "[Stage 1] Display DB2 instance stop result"
  ansible.builtin.debug:
    msg: "DB2 instance stop: {{ 'SUCCESS' if db2_instance_stop_result.rc == 0 else 'FAILED (rc=' + (db2_instance_stop_result.rc | string) + ')' }}"
  when: tsm_user_check.ansible_facts is defined

- name: "[Stage 1] Wait for graceful shutdown to complete"
  ansible.builtin.pause:
    seconds: "{{ cleanup_wait_seconds | default(10) }}"
  when: tsm_user_check.ansible_facts is defined

# Stage 2: Verify and Retry with Force Kill if Needed
- name: "[Stage 2] Check for remaining DB2 processes (excluding zombies)"
  ansible.builtin.shell: "ps aux | grep -E 'db2|DB2' | grep -v grep | grep -v '<defunct>'"
  register: db2_process_check
  failed_when: false
  changed_when: false

- name: "[Stage 2] Display DB2 process details if any remain"
  ansible.builtin.debug:
    msg: |
      DB2 processes still running after graceful shutdown:
      {{ db2_process_check.stdout_lines | default(['None']) | join('\n') }}
  when: db2_process_check.rc == 0

- name: "[Stage 2] Force kill DB2 processes (SIGKILL)"
  ansible.builtin.shell: "pkill -9 -f 'db2|DB2' || true"
  register: db2_force_kill_result
  failed_when: false
  when:
    - tsm_user_check.ansible_facts is defined
    - db2_process_check.rc == 0

- name: "[Stage 2] Display force kill result"
  ansible.builtin.debug:
    msg: "DB2 force kill (SIGKILL): {{ 'Executed' if db2_force_kill_result.rc == 0 else 'No processes found' }}"
  when:
    - tsm_user_check.ansible_facts is defined
    - db2_process_check.rc == 0

- name: "[Stage 2] Wait after force kill"
  ansible.builtin.pause:
    seconds: "{{ cleanup_retry_delay | default(5) }}"
  when:
    - tsm_user_check.ansible_facts is defined
    - db2_process_check.rc == 0

- name: "[Stage 2] Verify DB2 processes stopped with retry"
  ansible.builtin.shell: "ps aux | grep -E 'db2|DB2' | grep -v grep | grep -v '<defunct>'"
  register: db2_final_check
  failed_when: false
  changed_when: false
  when:
    - tsm_user_check.ansible_facts is defined
    - db2_process_check.rc == 0
  retries: "{{ cleanup_max_retries | default(3) }}"
  delay: "{{ cleanup_retry_delay | default(5) }}"
  until: db2_final_check.rc != 0 or db2_final_check.rc is undefined

# Stage 3: Final Verification
- name: "[Stage 3] Final DB2 process check"
  ansible.builtin.shell: "ps aux | grep -E 'db2|DB2' | grep -v grep | grep -v '<defunct>'"
  register: db2_critical_check
  failed_when: false
  changed_when: false

- name: "[Stage 3] Display final DB2 status"
  ansible.builtin.debug:
    msg: |
      {% if db2_critical_check.rc != 0 %}
      ✓ DB2 processes successfully stopped
      {% else %}
      ⚠ DB2 processes still running:
      {{ db2_critical_check.stdout_lines | join('\n') }}
      {% if cleanup_force_mode | default(true) %}
      Continuing cleanup in force mode...
      {% else %}
      Cleanup will fail in strict mode.
      {% endif %}
      {% endif %}

- name: "[Stage 3] Fail if critical DB2 processes still running (strict mode)"
  ansible.builtin.fail:
    msg: |
      DB2 processes are still running after all stop attempts.
      Processes found:
      {{ db2_critical_check.stdout_lines | join('\n') }}
      
      Manual intervention required. Consider:
      1. Checking for hung DB2 connections
      2. Reviewing DB2 diagnostic logs
      3. Running cleanup with cleanup_force_mode: true
  when:
    - tsm_user_check.ansible_facts is defined
    - db2_critical_check.rc == 0
    - not (cleanup_force_mode | default(true))

# ============================================================================
# DSMSERV Shutdown - Multi-Stage Robust Process
# ============================================================================

# Stage 1: Graceful Kill Attempt
- name: "[Stage 1] Kill dsmserv processes (SIGTERM)"
  ansible.builtin.shell: "pkill -f dsmserv || true"
  register: dsmserv_kill_result
  failed_when: false

- name: "[Stage 1] Display dsmserv kill result"
  ansible.builtin.debug:
    msg: "Kill dsmserv processes (SIGTERM): {{ 'Executed' if dsmserv_kill_result.rc == 0 else 'No processes found' }}"

- name: "[Stage 1] Wait for graceful shutdown"
  ansible.builtin.pause:
    seconds: "{{ cleanup_wait_seconds | default(10) }}"

# Stage 2: Verify and Force Kill if Needed
- name: "[Stage 2] Check for remaining dsmserv processes (excluding zombies)"
  ansible.builtin.shell: "ps aux | grep -i dsmserv | grep -v grep | grep -v '<defunct>'"
  register: dsmserv_process_check
  failed_when: false
  changed_when: false

- name: "[Stage 2] Display dsmserv process details if any remain"
  ansible.builtin.debug:
    msg: |
      dsmserv processes still running after graceful kill:
      {{ dsmserv_process_check.stdout_lines | default(['None']) | join('\n') }}
  when: dsmserv_process_check.rc == 0

- name: "[Stage 2] Force kill dsmserv (SIGKILL)"
  ansible.builtin.shell: "pkill -9 -f dsmserv || true"
  register: dsmserv_force_kill_result
  failed_when: false
  when: dsmserv_process_check.rc == 0

- name: "[Stage 2] Display force kill result"
  ansible.builtin.debug:
    msg: "dsmserv force kill (SIGKILL): {{ 'Executed' if dsmserv_force_kill_result.rc == 0 else 'No processes found' }}"
  when: dsmserv_process_check.rc == 0

- name: "[Stage 2] Wait after force kill"
  ansible.builtin.pause:
    seconds: "{{ cleanup_retry_delay | default(5) }}"
  when: dsmserv_process_check.rc == 0

- name: "[Stage 2] Verify dsmserv processes stopped with retry"
  ansible.builtin.shell: "ps aux | grep -i dsmserv | grep -v grep | grep -v '<defunct>'"
  register: dsmserv_final_check
  failed_when: false
  changed_when: false
  when: dsmserv_process_check.rc == 0
  retries: "{{ cleanup_max_retries | default(3) }}"
  delay: "{{ cleanup_retry_delay | default(5) }}"
  until: dsmserv_final_check.rc != 0 or dsmserv_final_check.rc is undefined

# Stage 3: Final Verification
- name: "[Stage 3] Final dsmserv process check"
  ansible.builtin.shell: "ps aux | grep -i dsmserv | grep -v grep | grep -v '<defunct>'"
  register: dsmserv_critical_check
  failed_when: false
  changed_when: false

- name: "[Stage 3] Display final dsmserv status"
  ansible.builtin.debug:
    msg: |
      {% if dsmserv_critical_check.rc != 0 %}
      ✓ dsmserv processes successfully stopped
      {% else %}
      ⚠ dsmserv processes still running:
      {{ dsmserv_critical_check.stdout_lines | join('\n') }}
      {% if cleanup_force_mode | default(true) %}
      Continuing cleanup in force mode...
      {% else %}
      Cleanup will fail in strict mode.
      {% endif %}
      {% endif %}

- name: "[Stage 3] Fail if dsmserv processes still running (strict mode)"
  ansible.builtin.fail:
    msg: |
      dsmserv processes are still running after all kill attempts.
      Processes found:
      {{ dsmserv_critical_check.stdout_lines | join('\n') }}
      
      Manual intervention required. Consider:
      1. Checking for active client connections
      2. Reviewing dsmserv activity logs
      3. Running cleanup with cleanup_force_mode: true
  when:
    - dsmserv_critical_check.rc == 0
    - not (cleanup_force_mode | default(true))

# sudo su - tsminst1 -c ". /home/tsminst1/sqllib/db2profile && dsmserv removedb tsmdb001"
- name: Remove the TSM database
  ansible.builtin.shell: "sudo su - {{ tsm_user }} -c '. dsmserv removedb TSMdbspace01'"
  args:
    chdir: "/{{ tsm_user }}"
  when: tsm_user_check.ansible_facts is defined
  register: db_remove_result
  failed_when: false

- name: Display TSM database removal result
  ansible.builtin.debug:
    msg: "TSM database removal: {{ 'SUCCESS' if db_remove_result.rc == 0 else 'FAILED (rc=' + (db_remove_result.rc | string) + ') - ' + db_remove_result.stderr }}"
  when: tsm_user_check.ansible_facts is defined

- name: Drop the DB2 instance
  ansible.builtin.shell: "{{ db2_instance_path }}/db2idrop {{ tsm_user }}"
  when: tsm_user_check.ansible_facts is defined
  register: db2_drop_result
  failed_when: false

- name: Display DB2 instance drop result
  ansible.builtin.debug:
    msg: "DB2 instance drop: {{ 'SUCCESS' if db2_drop_result.rc == 0 else 'FAILED (rc=' + (db2_drop_result.rc | string) + ') - Instance may not exist' }}"
  when: tsm_user_check.ansible_facts is defined

# sudo pkill -KILL -u tsminst1
- name: Kill the processes of user before removing
  ansible.builtin.shell: "sudo pkill -KILL -u {{ tsm_user }}"
  when: tsm_user_check.ansible_facts is defined
  register: user_kill_result
  failed_when: false

- name: Display user process kill result
  ansible.builtin.debug:
    msg: "Kill user processes: {{ 'SUCCESS (processes killed)' if user_kill_result.rc == 0 else 'NO PROCESSES FOUND' if user_kill_result.rc == 1 else 'FAILED (rc=' + (user_kill_result.rc | string) + ')' }}"
  when: tsm_user_check.ansible_facts is defined

- name: Verify user processes are stopped
  ansible.builtin.shell: "ps aux | grep {{ tsm_user }} | grep -v grep"
  register: user_process_check
  failed_when: false
  changed_when: false
  when: tsm_user_check.ansible_facts is defined

- name: Fail if user processes still running
  ansible.builtin.fail:
    msg: "Processes for user {{ tsm_user }} are still running. Manual intervention required."
  when:
    - tsm_user_check.ansible_facts is defined
    - user_process_check.rc == 0

- name: Remove the TSM user
  ansible.builtin.user:
    name: "{{ tsm_user }}"
    state: absent
    remove: true
  when: tsm_user_check.ansible_facts is defined
  register: user_remove_result

- name: Display user removal result
  ansible.builtin.debug:
    msg: "TSM user removal: {{ 'SUCCESS' if user_remove_result is succeeded else 'FAILED' }}"
  when: tsm_user_check.ansible_facts is defined

- name: Remove the TSM group
  ansible.builtin.group:
    name: "{{ tsm_group }}"
    state: absent
  register: group_remove_result

- name: Display group removal result
  ansible.builtin.debug:
    msg: "TSM group removal: {{ 'SUCCESS' if group_remove_result is succeeded else 'FAILED' }}"

#- name: Unmount /tsmroot
#  ansible.builtin.command: "sudo umount {{ root_dir }}"
#  ignore_errors: true

# Importing storage_prepare role to umount the directories only if blueprint is set to true
- name: Umount the directories
  ansible.builtin.include_role:
    name: storage_prepare
  vars:
    clean_up: true
  when: server_blueprint == true

- name: Remove user-related directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/home/{{ tsm_user }}"
    - "/export/home/{{ tsm_user }}"
    - "/var/spool/mail/{{ tsm_user }}"
    - "/etc/tivoli/tsm/instanceList.obj"
    - "/{{ tsm_user }}"
  ignore_errors: true
...
