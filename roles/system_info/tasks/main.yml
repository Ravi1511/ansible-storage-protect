---
# Detect OS first
- name: Detect operating system
  ansible.builtin.command: uname -s
  register: uname_result
  changed_when: false

- name: Set OS type fact
  ansible.builtin.set_fact:
    detected_os_type: "{{ 'AIX' if 'AIX' in uname_result.stdout else 'Linux' }}"

# ============================================================================
# Memory Information (OS-specific)
# ============================================================================
- name: Get Memory Information (Linux)
  ansible.builtin.command: free -m
  register: memory_info_linux
  ignore_errors: true
  changed_when: false
  when: detected_os_type == "Linux"

- name: Get Memory Information (AIX)
  ansible.builtin.shell: |
    svmon -G | grep memory
  register: memory_info_aix
  ignore_errors: true
  changed_when: false
  when: detected_os_type == "AIX"

- name: Set memory info fact
  ansible.builtin.set_fact:
    memory_info_output: "{{ memory_info_linux.stdout if detected_os_type == 'Linux' else memory_info_aix.stdout }}"
  when: (detected_os_type == "Linux" and memory_info_linux.rc == 0) or (detected_os_type == "AIX" and memory_info_aix.rc == 0)

# ============================================================================
# Architecture Information (OS-specific)
# ============================================================================
- name: Collect Architecture Information (Linux)
  ansible.builtin.command: lscpu
  register: lscpu_output
  changed_when: false
  ignore_errors: true
  when: detected_os_type == "Linux"

- name: Extract Architecture Info (Linux)
  ansible.builtin.set_fact:
    architecture: "{{ lscpu_output.stdout | regex_search('Architecture:\\s+(\\S+)', '\\1') | first }}"
  when: detected_os_type == "Linux" and lscpu_output.rc == 0

- name: Collect Architecture Information (AIX)
  ansible.builtin.command: uname -p
  register: uname_arch_aix
  changed_when: false
  ignore_errors: true
  when: detected_os_type == "AIX"

- name: Set Architecture Info (AIX)
  ansible.builtin.set_fact:
    architecture: "{{ uname_arch_aix.stdout }}"
  when: detected_os_type == "AIX" and uname_arch_aix.rc == 0

- name: Set default architecture if detection failed
  ansible.builtin.set_fact:
    architecture: "unknown"
  when: architecture is not defined

# ============================================================================
# OS Information
# ============================================================================
- name: Collect OS Information using ansible setup module
  ansible.builtin.set_fact:
    os_name: "{{ ansible_facts['os_family'] | default('Unknown') }}"
    os_version: "{{ ansible_facts['distribution_version'] | default('Unknown') }}"

# ============================================================================
# Java Version
# ============================================================================
- name: Collect Java Version Information
  ansible.builtin.command: java -version 2>&1
  register: java_version_output
  changed_when: false
  ignore_errors: true

- name: Extract Java Version
  ansible.builtin.set_fact:
    java_version: "{{ java_version_output.stderr.splitlines()[0] }}"
  when: java_version_output.rc == 0

- name: Handle Java Version Error
  ansible.builtin.set_fact:
    java_version: "Java is not installed on the system."
  when: java_version_output.rc != 0

# ============================================================================
# Disk Space Information (OS-specific)
# ============================================================================
- name: Collect Disk Space Information for /opt (Linux)
  ansible.builtin.command: df -BM /opt
  register: disk_info_linux
  changed_when: false
  ignore_errors: true
  when: detected_os_type == "Linux"

- name: Collect Disk Space Information for /opt (AIX)
  ansible.builtin.command: df -m /opt
  register: disk_info_aix
  changed_when: false
  ignore_errors: true
  when: detected_os_type == "AIX"

- name: Parse Disk Space Information for /opt (Linux)
  ansible.builtin.set_fact:
    disk_space:
      filesystem: "{{ disk_info_linux.stdout.splitlines()[1].split()[0] }}"
      size_mb: "{{ disk_info_linux.stdout.splitlines()[1].split()[1] | regex_replace('M', '') | int }}"
      used_mb: "{{ disk_info_linux.stdout.splitlines()[1].split()[2] | regex_replace('M', '') | int }}"
      available_mb: "{{ disk_info_linux.stdout.splitlines()[1].split()[3] | regex_replace('M', '') | int }}"
      use_percent: "{{ disk_info_linux.stdout.splitlines()[1].split()[4] }}"
      mount_point: "{{ disk_info_linux.stdout.splitlines()[1].split()[5] }}"
  when: detected_os_type == "Linux" and disk_info_linux.rc == 0

- name: Parse Disk Space Information for /opt (AIX)
  ansible.builtin.set_fact:
    disk_space:
      filesystem: "{{ disk_info_aix.stdout.splitlines()[1].split()[0] }}"
      size_mb: "{{ disk_info_aix.stdout.splitlines()[1].split()[1] | int }}"
      used_mb: "{{ disk_info_aix.stdout.splitlines()[1].split()[2] | int }}"
      available_mb: "{{ disk_info_aix.stdout.splitlines()[1].split()[2] | int }}"
      use_percent: "{{ disk_info_aix.stdout.splitlines()[1].split()[3] }}"
      mount_point: "{{ disk_info_aix.stdout.splitlines()[1].split()[6] }}"
  when: detected_os_type == "AIX" and disk_info_aix.rc == 0

- name: Set default disk space if detection failed
  ansible.builtin.set_fact:
    disk_space:
      filesystem: "unknown"
      size_mb: 0
      used_mb: 0
      available_mb: 0
      use_percent: "0%"
      mount_point: "/opt"
  when: disk_space is not defined

# ============================================================================
# Collect All System Information
# ============================================================================
- name: Collect All System Information
  ansible.builtin.set_fact:
    system_info:
      Architecture: "{{ architecture }}"
      OS Name: "{{ os_name }}"
      OS Version: "{{ os_version }}"
      OS Type: "{{ detected_os_type }}"
      Filesystem Disk Space:
        - Free Memory: "{{ disk_space.available_mb }} MB"
      Java Version: "{{ java_version }}"
      Memory Info: "{{ memory_info_output | default('Not available') }}"

- name: Show Collected System Information
  ansible.builtin.debug:
    var: system_info

